# Render Blueprint: New -> Blueprint -> pick this repo. Render asks for the two API keys once.
services:
  - type: web
    name: finn
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: FINN_DATA_DIR
        value: /tmp/finn
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
